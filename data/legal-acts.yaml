    about: Каталог цифровых данных из паспортов данных, менеджер по данным, описание неоцифрованных данных, критерии качества.
    provisions:
      - принято по пункту 3 статьи 16 Цифрового кодекса; отменило постановление от 07.11.2024 № 925
      - пункт 2 — распространяются на государственные органы, государственные юридические лица и квазигосударственный сектор, кроме специальных государственных органов
      - пункт 6 — виды метаданных — функциональные, технические, операционные; пункт 8 — менеджер по данным
      - пункты 9–14 и приложение 1 — каталог цифровых данных из паспортов цифровых данных на архитектурном портале; каталог актуализируют при каждом изменении структуры или источников данных; паспорт у новых систем — до ввода в промышленную эксплуатацию
      - пункт 19 — доступ к каталогу бесплатный для организаций; сведения о видах данных на основе общедоступной информации бесплатно получают граждане и компании
      - пункт 20 и приложение 2 — описание неоцифрованных данных — бумажных, электронных таблиц, реестров
      - пункт 26 — архитектуру цифровых данных формируют на основе каталога; пункт 27 — концептуальная модель данных предметной области по паспортам, проверка ежемесячно, 5-го числа
      - пункт 29 — десять критериев качества — точность, полнота, взаимосвязанность, сопоставимость, актуальность, уникальность, достоверность, своевременность, ясность, доступность
      - пункты 79–83 — отказ от данных меняет сведения в каталоге, данные архивируют или уничтожают
    topics: [data_governance, quality, standards]
