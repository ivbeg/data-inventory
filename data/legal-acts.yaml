  - id: fi-906-2019
    country: fi
    title: Закон об управлении информацией в государственном управлении
    title_original: Laki julkisen hallinnon tiedonhallinnasta
    short: закон 906/2019
    number: 906/2019
    date: 2019-08-09
    in_force: 2020-01-01
    edition: "консолидированный текст Finlex с изменениями до 530/2026; изменение 530/2026 действует с 01.07.2026: архивирование — часть модели управления информацией, модели приводят в соответствие за 18 месяцев"
    status: in_force
    status_checked: 2026-10-28
    about: Модель управления информацией в каждом органе — процессы, информационные ресурсы, системы, обмены — и публичное описание ресурсов для запросов.
    provisions:
      - § 5(1)–(2) — модель управления информацией (tiedonhallintamalli) — процессы и ответственные; информационные ресурсы, их связи с процессами и системами и сведения реестра обработки по статье 30 GDPR; архивирование; системы, их интерфейсы и способы передачи данных; меры безопасности
      - § 5(3) — до крупных изменений и новых систем оценивают их влияние и обновляют модель
      - § 6 — Министерство финансов ведёт карту управления информацией государственного управления (julkisen hallinnon tiedonhallintakartta)
      - §§ 10–11 — Совет по управлению информацией оценивает исполнение закона, получает сведения несмотря на тайну, при нарушениях «обращает внимание» органа, отчитывается раз в два года
      - § 19(2) — наборы данных — машиночитаемо и с описаниями; § 22 — для регулярных обменов через интерфейсы описание структуры данных ведёт передающий орган
      - § 28 — описание информационных ресурсов и регистра дел для доступа к документам (asiakirjajulkisuuskuvaus) — системы, кто решает о выдаче, наборы по группам данных, поисковые признаки, доступ через интерфейс; публикуется в сети
      - § 30 — модель — в течение 12 месяцев после вступления закона в силу
    topics: [data_governance, systems, access]
    chapters:
      - 05-frameworks/04-international-practice.md#модель-управления-информацией-в-финляндии
    url: https://www.finlex.fi/fi/lainsaadanto/2019/906
    links:
      - title: перевод на английский (Act on Information Management in Public Administration, текст 2019 года)
        url: https://www.finlex.fi/en/legislation/translations/2019/eng/906

