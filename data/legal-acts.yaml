  - id: fr-crpa
    country: fr
    title: Кодекс отношений между публикой и администрацией (CRPA)
    title_original: Code des relations entre le public et l'administration
    short: CRPA
    number: кодекс
    edition: издание codes.droit.org от 24.10.2026; последнее изменение — 28.05.2026
    status: in_force
    status_checked: 2026-10-25
    about: Право на документы, обязательная публикация, перечень документов, эталонные данные, обмен сведениями между администрациями.
    provisions:
      - L300-2 — административный документ — любой документ администрации «независимо от формы и носителя», в том числе статистика и исходные коды
      - L311-5 и L311-6 — что не сообщают (L311-5 изменена законом n° 2026-403 от 26 мая 2026 года); L311-7 — документ выдают, скрыв то, что сообщать нельзя
      - R*311-12 и R311-13 — молчание администрации месяц означает отказ; R343-1 и R343-3 — обращение в CADA в течение двух месяцев, её заключение — за месяц
      - L312-1-1 — публикуют выданные по запросам документы, документы из перечня, обновляемые базы данных и данные, публикация которых в общественных интересах; D312-1-1-1 — порог 50 сотрудников в эквиваленте полной занятости; образования с населением менее 3500 жителей освобождены
      - L321-4 и R321-5 — девять баз эталонных данных и их производители; отбирают в том числе по требованию высокого качества (R321-5 — в редакции декрета n° 2024-606 от 26 июня 2024 года)
      - L322-6 и R322-7 — перечень основных документов с публичной информацией, ежегодное обновление; у документа — название, предмет, дата создания, условия использования, даты и предмет обновлений; перечень смотрят до запроса
      - L114-8 в редакции закона n° 2022-217 от 21 февраля 2022 года — обмен сведениями для рассмотрения обращения; список получателей, сведений и оснований публикуется
      - D114-9-1 (декрет n° 2026-54 от 3 февраля 2026 года) — кто какие сведения отдаёт — 21 строка, 9 о частных лицах и 12 о предприятиях и некоммерческих организациях
    response_time: "Молчание в течение месяца со дня получения запроса означает отказ. Отказ обжалуют в Комиссии по доступу к административным документам (CADA) в течение двух месяцев; комиссия даёт заключение за месяц. Без обращения в CADA в суд идти нельзя"
    topics: [access, open_data, sharing, quality]
    chapters:
      - 07-countries/04-france.md#правовая-основа
      - 03-process/06-access.md#запрос-владельцу
      - 03-process/06-access.md#где-искать-основания
      - 05-frameworks/04-international-practice.md#политика-данных-франции
    url: https://codes.droit.org/PDF/Code%20des%20relations%20entre%20le%20public%20et%20l'administration.pdf
    note: Légifrance из сети проверки не открылся; ссылка — издание кодекса на codes.droit.org, собранное из Légifrance.

