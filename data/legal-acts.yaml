  # --- Казахстан ---

  - id: kz-digital-code
    country: kz
    title: Цифровой кодекс
    title_original: Цифровой кодекс Республики Казахстан
    short: Цифровой кодекс
    number: № 255-VIII
    date: 2026-01-09
    edition: "в редакции от 21.10.2026; изменён, в частности, законом от 23.07.2026 № 352-VIII"
    in_force: 2026-07-12
    status: in_force
    status_checked: 2026-10-24
    about: Цифровые объекты и их учёт, административные данные, национальные регистры, порталы открытых данных и архитектурный портал.
    provisions:
      - статья 16 — доступ оператора «цифрового правительства» к данным государственных органов для аналитики — по требованиям к управлению цифровыми данными, которые утверждает правительство
      - статья 17 — портал открытых данных; обладатели информации размещают на нём открытые данные, доступ бесплатный и без дискриминации, в том числе через программный интерфейс
      - статья 18 — административные цифровые данные формируют государственные органы, государственные юридические лица и квазигосударственный сектор при исполнении функций и оказании услуг; их качество определяет орган государственной статистики
      - статья 19 — национальные регистры — цифровые ресурсы с эталонными данными, единый источник достоверных сведений; если данные есть в регистре, государственные цифровые объекты берут их оттуда
      - статья 20 — цифровые объекты (записи, активы, ресурсы, программы, системы, платформы, инфраструктура, продукты цифровых данных) учитывают в классификаторе цифровых объектов; правила классификатора утверждены приказом министра в августе 2026 года, сам классификатор на 25 октября 2026 года опубликованным не найден
      - статьи 30 и 31 — продукт цифровых данных — «агрегированный, формализованный результат обработки цифровых данных» для использования, обмена и оборота; на платформе обмена не позволяет идентифицировать людей и включает метаданные о составе, структуре, назначении и условиях использования; владельцы платформ обмена ведут перечень продуктов
      - статьи 24 и 28 — цифровой ресурс (данные и записи с программами для их обработки), интернет-ресурс и цифровая система; владелец системы и владелец ресурсов в ней могут быть разными лицами
      - статья 38 — собственник и (или) владелец цифрового объекта
      - статья 33 — перечень критически важных цифровых объектов утверждает уполномоченный орган в сфере обеспечения кибербезопасности
      - статья 41 — право на удаление, обезличивание и ограничение обработки персональных данных
      - статьи 71 и 72 — архитектурный портал цифровых объектов государства и архитектурно-координационный центр; сведения о цифровых объектах на портале размещают и поддерживают в актуальном виде сами государственные органы, государственные юридические лица и квазигосударственный сектор
      - статья 89 — прекращение промышленной эксплуатации цифрового объекта «цифрового правительства» — решение собственника или владельца по согласованию с уполномоченным органом, сведения на архитектурном портале меняют
      - статья 90 — цифровые записи, техническую документацию и исходные коды архивируют; объект, который заменили платформенные продукты, могут списать
      - статья 106 — порядок введения в действие
    topics: [systems, data_governance, open_data, quality, archives, personal_data, mandates]
    chapters:
      - 07-countries/01-kazakhstan.md#правовая-основа
      - 01-basics/02-what-is-inventoried.md#как-это-называется-в-стандартах-и-законах
      - 03-process/03-owners-and-mandates.md#где-искать-полномочия
      - 03-process/03-owners-and-mandates.md#как-читать-полномочия
      - 03-process/07-quality.md#рамки-и-стандарты-качества
      - 04-sources/01-three-layers.md#как-определить-слой
      - 04-sources/02-government.md#реестры-информационных-систем
      - 04-sources/06-legacy.md#где-искать-преемника
      - 05-frameworks/03-data-mesh.md#продукт-данных
    url: https://adilet.zan.kz/rus/docs/K2600000255
    note: "Дата вступления в силу — по новости Министерства искусственного интеллекта и цифрового развития от 14 июля 2026 года. Статьи 89 и 90 сверены 25 октября 2026 года по копии на zakon.uchet.kz."

