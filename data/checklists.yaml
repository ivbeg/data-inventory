# Чек-листы книги. Из этого файла scripts/appendices.mjs строит приложение «Чек-листы»
# (docs/09-appendices/_generated/), таблицу для Excel static/downloads/checklists.csv
# и страницу для печати static/downloads/checklists.html — по чек-листу на лист A4.
# Формат полей — data/README.md. Страницу приложения руками не правят: правят этот файл.
#
# У каждого пункта обязательна ссылка на главу (chapter), где пункт объяснён.
# Подпись ссылки скрипт берёт из заголовка раздела; label задают, только если нужна другая.
# Заголовки чек-листов, на которые ссылаются главы, не переименовывают:
# «Перед началом», «Перед публикацией реестра», «Перед ссылкой на нормативный акт».

checklists:

  - id: minimum
    title: Минимум
    steps: [1, 2, 3, 4, 5, 6, 7]
    when: Срочная задача — подборка данных для хакатона, первая оценка отрасли
    intro: Шаги совмещают, но не пропускают. Подробно — в разделе «Если времени мало» главы «Семь шагов»; здесь — те же пункты коротко.
    items:
      - text: "Шаги 1–2 — одна встреча с владельцем задачи: записаны цель и границы, 10–15 вопросов, подход и три метода."
        chapter: 03-process/01-steps.md#если-времени-мало
      - text: Шаг 3 — у каждого источника записаны владелец, режим доступа с основанием, откуда известно и дата.
        chapter: 03-process/01-steps.md#если-времени-мало
      - text: Шаг 3 — остальные атрибуты заполнены только у ключевых источников.
        chapter: 03-process/05-registry.md#глубина-описания
      - text: Шаг 4 — черновик обсудили с одним-двумя экспертами.
        chapter: 03-process/08-gaps-and-plan.md#шаг-4-эксперты-и-владельцы
      - text: Шаг 5 — есть таблица «вопрос — источник — статус» и список пробелов.
        chapter: 03-process/08-gaps-and-plan.md#шаг-5-таблица-покрытия
      - text: Шаги 6–7 — у каждого пробела одна строка о том, как его закрыть; вместо каталога — таблица с датой.
        chapter: 03-process/08-gaps-and-plan.md#шаг-6-план
      - text: Не выброшены три вещи — записанная цель, список пробелов и дата.
        chapter: 03-process/01-steps.md#если-времени-мало

  - id: before-start
    title: Перед началом
    steps: [1, 2]
    when: До поиска первого источника
    items:
      - text: "Записана цель: что будет сделано с данными и как проверить результат."
        chapter: 01-basics/03-goals.md#как-записать-цель
      - text: Назван владелец задачи — тот, кто примет результат и решит, какие пробелы закрывать.
        chapter: 03-process/01-steps.md#кто-участвует
      - text: Выбран подход — «чем владеем» или «где найти нужное».
        chapter: 02-approaches/01-two-approaches.md#как-выбрать-подход
      - text: "Записаны границы: организации и уровни, территория, слои данных, период, глубина и что исключено."
        chapter: 03-process/02-goals-and-questions.md#границы
      - text: Вопросы собраны с владельцем задачи, укрупнены и проверены по типовым темам; главные отмечены.
        chapter: 03-process/02-goals-and-questions.md#как-проверить-список
      - text: У каждого вопроса записан порог «годится» — до поиска.
        chapter: 03-process/02-goals-and-questions.md#как-записать
      - text: Список вопросов согласован с владельцем задачи до поиска.
        chapter: 03-process/02-goals-and-questions.md#как-проверить-список
      - text: Широкая тема разбита на очереди, первая очередь выбрана.
        chapter: 03-process/01-steps.md#если-тема-большая
      - text: "Выбраны методы: их больше одного, и они закрывают слепые пятна друг друга."
        chapter: 02-approaches/02-methods.md#как-выбрать-и-сочетать-методы
      - text: Утверждён состав атрибутов — 14 обязательных и расширенные, нужные цели.
        chapter: 03-process/05-registry.md#расширенный-состав
      - text: Утверждены справочники значений и стандарт описания.
        chapter: [03-process/05-registry.md#справочники-значений, 05-frameworks/02-metadata-standards.md]
      - text: Заведён реестр.
        chapter: 09-appendices/03-templates.md
        label: Шаблоны

  - id: mandates
    title: Анализ полномочий
    steps: [3]
    when: Перед тем как выписывать полномочия из положений и законов
    items:
      - text: Список владельцев начат с вопроса «кто обязан этим заниматься?», а не «у кого есть сайт».
        chapter: 03-process/03-owners-and-mandates.md#кто-отвечает-за-тему
      - text: Пройдены все уровни в границах — центр, регионы, подведомственные, фонды и регуляторы; кого исключили, записано.
        chapter: 03-process/03-owners-and-mandates.md#кто-отвечает-за-тему
      - text: Список владельцев сверен с действующей структурой органов; у упразднённых записан преемник.
        chapter: 03-process/03-owners-and-mandates.md#кто-отвечает-за-тему
      - text: У каждого владельца найдены положение, отраслевой закон и акты о системах — в действующей редакции, с датой проверки.
        chapter: 03-process/03-owners-and-mandates.md#где-искать-полномочия
      - text: Выписаны формулировки, за которыми стоят данные — «ведёт реестр», «регистрирует», «выдаёт лицензии», «собирает отчётность»; «координирует» и «содействует» не выписаны.
        chapter: 03-process/03-owners-and-mandates.md#как-читать-полномочия
      - text: Эталонный реестр — источник достоверных сведений для других систем — найден первым.
        chapter: 03-process/03-owners-and-mandates.md#как-читать-полномочия
      - text: "Одна строка — одно полномочие: дословная цитата, акт с номером, датой и редакцией, пункт, ожидаемые данные."
        chapter: 03-process/03-owners-and-mandates.md#как-записать
      - text: Ожидаемый набор, которого нет в тексте прямо, начинается со слова «вывод:».
        chapter: 03-process/03-owners-and-mandates.md#как-читать-полномочия
      - text: У органа, который только утвердил форму учёта, владельцем данных записан тот, кто форму заполняет и сводит.
        chapter: 03-process/03-owners-and-mandates.md#как-читать-полномочия
      - text: У каждой строки итог — найдено, найдено частично, не найдено, передано или «система есть, полномочия нет».
        chapter: 03-process/03-owners-and-mandates.md#от-полномочия-к-набору
      - text: Строки «не найдено» не удалены — они уходят в пробелы и вопросы владельцу.
        chapter: 03-process/03-owners-and-mandates.md#от-полномочия-к-набору
      - text: Если полномочия выписывала языковая модель — пройден чек-лист «Работа с языковой моделью».
        chapter: 02-approaches/03-ai.md#как-делать

  - id: legal-act
    title: Перед ссылкой на нормативный акт
    steps: [3]
    when: Каждый раз, когда акт записывают в реестр, в полномочие или в основание доступа
    items:
      - text: Акт проверен по официальной базе своей страны.
        chapter: 09-appendices/02-legal-framework.md#где-проверять-акт
      - text: Акт действует — нет отметки «утратил силу».
        chapter: 09-appendices/02-legal-framework.md#как-читать
        label: Нормативная база
      - text: Взята последняя редакция.
        chapter: 03-process/03-owners-and-mandates.md#где-искать-полномочия
      - text: Нет принятых, но не вступивших в силу изменений.
        chapter: 09-appendices/02-legal-framework.md#как-читать
        label: Нормативная база
      - text: Записаны номер, дата, статья и редакция.
        chapter: 03-process/06-access.md#как-записать
      - text: Сохранён адрес официального текста — его ждут стандарты описания.
        chapter: 05-frameworks/02-metadata-standards.md#сопоставление-с-реестром
      - text: Записана дата проверки.
        chapter: 09-appendices/02-legal-framework.md#как-читать
        label: Нормативная база

  - id: government
    title: При поиске государственных данных
    steps: [3]
    when: Подход «где найти нужное», государственный слой
    items:
      - text: "В границах названы уровни власти и организации: центральные, региональные и местные органы, подведомственные учреждения, государственные компании."
        chapter: 04-sources/02-government.md#что-считать-государственными-данными
      - text: Пройдены все виды источников, а не только портал — статистика и формы сбора, реестр систем и описания систем с персональными данными, закупки, акты, сайты и поддомены.
        chapter: 04-sources/02-government.md#как-использовать-при-инвентаризации
      - text: Портал сравнён с перечнями, формами сбора и полномочиями.
        chapter: 04-sources/02-government.md#порталы-открытых-данных
      - text: Набор, которого нет на портале, записан как вопрос владельцу, а не как отсутствие данных.
        chapter: 04-sources/02-government.md#порталы-открытых-данных
      - text: Владелец записан по положению или акту о системе, а не по издателю на портале.
        chapter: 03-process/03-owners-and-mandates.md#владелец-оператор-ответственный
      - text: Следы одного набора в разных источниках сведены в одну запись; каждый источник — в поле «откуда известно», расхождения записаны.
        chapter: 04-sources/02-government.md#как-использовать-при-инвентаризации
      - text: Государственные сайты проверены из сети страны; сеть проверки записана.
        chapter: 04-sources/06-legacy.md#как-проверить-адрес

  - id: dataset-search
    title: При поиске наборов данных
    steps: [3]
    when: Поиск по каталогам и поисковикам наборов
    items:
      - text: Выбраны поисковики под слой, тему и страну.
        chapter: 04-sources/05-dataset-search.md#по-странам
      - text: По реестру каталогов проверено, каких каталогов страны нет в индексе, и они просмотрены напрямую.
        chapter: 04-sources/05-dataset-search.md#по-странам
      - text: Запросы — на языке страны и по-английски, с официальными названиями и владельцем; страна задана фильтром, а не словом в запросе.
        chapter: 04-sources/05-dataset-search.md#как-искать
      - text: У каждого кандидата записано, копия это или первоисточник; у копии найден первоисточник или отмечено, что он не установлен.
        chapter: 04-sources/05-dataset-search.md#от-набора-к-владельцу
      - text: Владелец — по документу, а не по издателю или автору в карточке поисковика.
        chapter: 04-sources/05-dataset-search.md#от-набора-к-владельцу
      - text: В реестре — адрес у первоисточника, а не карточка поисковика; поисковик, запрос и дата — в поле «откуда известно».
        chapter: 04-sources/05-dataset-search.md#как-записать
      - text: Каждый запрос записан в журнал поиска, пустые — тоже.
        chapter: 04-sources/05-dataset-search.md#как-записать

  - id: commercial
    title: Перед запросом коммерческих данных
    steps: [3]
    when: Пробел не закрыт государственными и общественными данными
    items:
      - text: В границах записано, входят ли коммерческие источники, можно ли платить и кто одобряет расходы.
        chapter: 04-sources/04-commercial.md#границы-и-порядок
      - text: Проверено бесплатное — раскрытие информации, отчёты и закупки компаний, их индексы и открытые данные.
        chapter: 04-sources/04-commercial.md#сначала-бесплатное
      - text: Проверены государственные копии — отчётность у регулятора, чеки у налоговой службы.
        chapter: 04-sources/04-commercial.md#сначала-бесплатное
      - text: У поставщика спросили, кого покрывают данные, с какого периода и с какими разрывами.
        chapter: 04-sources/04-commercial.md#что-спросить-у-поставщика
      - text: У поставщика спросили о подробности и наименьшем размере ячейки, о методике, свои ли это данные и на каких условиях их дают.
        chapter: 04-sources/04-commercial.md#что-спросить-у-поставщика
      - text: "Образец проверен до соглашения: выборка, разрывы, выбросы и нули, сверка с официальными данными."
        chapter: 04-sources/04-commercial.md#годится-ли-для-задачи
      - text: В условиях записаны соглашение, срок и кто может работать с данными.
        chapter: 04-sources/04-commercial.md#условия-и-сроки
      - text: Записано, что можно публиковать и передавать и что делать с данными после окончания срока.
        chapter: 04-sources/04-commercial.md#условия-и-сроки
      - text: "У копии государственного реестра записан первоисточник со связью `copy_of:`."
        chapter: 04-sources/03-public.md#первоисточник
      - text: Запрос отправлен, как только виден пробел, а не в конце работы.
        chapter: 04-sources/04-commercial.md#границы-и-порядок

  - id: questionnaire
    title: Перед рассылкой анкеты
    steps: [3]
    when: Подход «чем владеем», опрос подразделений и подведомственных
    items:
      - text: Адресаты — по подразделениям в границах, у каждого — сотрудник по имени, а не общий адрес.
        chapter: 03-process/04-questionnaires.md#кому-отправлять
      - text: Подведомственным — отдельный лист.
        chapter: 03-process/04-questionnaires.md#кому-отправлять
      - text: Анкета заполнена найденным — полномочиями без найденных наборов, системами из реестров и контрактов, опубликованными наборами.
        chapter: 03-process/04-questionnaires.md#заполнить-заранее
      - text: У каждой строки анкеты указано, откуда она.
        chapter: 03-process/04-questionnaires.md#заполнить-заранее
      - text: Вопросы повторяют поля реестра; есть строка-пример и значения из списка с вариантом «не знаю».
        chapter: 03-process/04-questionnaires.md#что-спрашивать
      - text: Есть вопросы о том, что ведут вне систем, чего не хватает и кто ещё работает с данными.
        chapter: 03-process/04-questionnaires.md#что-спрашивать
      - text: Письмо подписал владелец задачи; в пояснении — дата ответа, кому задать вопрос и кто увидит ответы.
        chapter: 03-process/04-questionnaires.md#как-проводить
      - text: Анкета проверена на первой очереди, даты интервью согласованы.
        chapter: 03-process/04-questionnaires.md#как-проводить
      - text: "Заведён лист «Адресаты»: кому и когда отправлено, кто ответил."
        chapter: 03-process/04-questionnaires.md#как-записать

  - id: interview
    title: Интервью
    steps: [3]
    when: После того как анкета вернулась заполненной
    items:
      - text: Интервью — по заполненной анкете, 15–30 минут, а не повторная рассылка.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Разговор идёт по строкам — новые, вычеркнутые, исправленные, «не знаю» и пустые; новые обсуждают первыми.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Сотрудника попросили показать систему, общий диск или таблицу, из которой собирают отчёт.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Спросили о работе — что подразделение отправляет каждый месяц и кому, что получает, по каким таблицам отвечает руководству.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Интервьюеров двое — один спрашивает, другой сразу вписывает ответы в анкету.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Опрос ведёт свой сотрудник; внешний подрядчик — только вместе с ним.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Разговор записывают только с согласия.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Запись интервью не отдают внешнему сервису языковой модели без решения владельца.
        chapter: 02-approaches/03-ai.md#закрытые-данные-и-внешние-модели
      - text: Исправленные строки отправлены ответственному и подтверждены письменно.
        chapter: 03-process/04-questionnaires.md#интервью
      - text: Расхождения ответа с другими методами стали вопросами или пробелами, а не удалены.
        chapter: 03-process/04-questionnaires.md#как-проверять-ответы

  - id: llm
    title: Работа с языковой моделью
    steps: [3]
    when: Модель читает положения, законы, сайты или пишет описания наборов
    items:
      - text: Модели дан текст документа с реквизитами, а не вопрос «какие реестры ведёт министерство».
        chapter: 02-approaches/03-ai.md#1-дать-модели-текст-а-не-вопрос
      - text: Действует ли акт, проверено до того, как отдать его модели.
        chapter: 02-approaches/03-ai.md#1-дать-модели-текст-а-не-вопрос
      - text: Длинный документ разделён по статьям и разделам.
        chapter: 02-approaches/03-ai.md#1-дать-модели-текст-а-не-вопрос
      - text: Ответ — таблица с полями реестра, источником и дословной цитатой.
        chapter: 02-approaches/03-ai.md#2-задать-форму-ответа--поля-реестра
      - text: Каждая цитата найдена программой в исходном тексте; строки без совпадения отброшены или отданы человеку.
        chapter: 02-approaches/03-ai.md#3-проверить-в-три-слоя
      - text: Строка, которую нашла только модель, остаётся гипотезой до подтверждения вторым методом или владельцем.
        chapter: 02-approaches/03-ai.md#3-проверить-в-три-слоя
      - text: Режим доступа, персональные данные и основание проверил человек.
        chapter: 02-approaches/03-ai.md#3-проверить-в-три-слоя
      - text: Одно-два положения размечены вручную и сравнены с ответом модели; сравнение повторено при смене модели или инструкции.
        chapter: 02-approaches/03-ai.md#4-начать-с-проверочной-выборки
      - text: В поле «откуда известно» записаны документ и цитата, модель с версией, дата, инструкция и статус — гипотеза или подтверждено.
        chapter: 02-approaches/03-ai.md#5-записать-откуда-известно
      - text: Описание набора модель писала по схеме и выборке строк, а не по одному названию; черновик помечен.
        chapter: 02-approaches/03-ai.md#описания-наборов
      - text: "«Не открылось» у агента не записано как «данных нет»."
        chapter: 02-approaches/03-ai.md#ошибки-модели-и-как-их-ловить
      - text: Внешнему сервису отданы только опубликованные акты, публичные сайты, открытые наборы и их описания.
        chapter: 02-approaches/03-ai.md#закрытые-данные-и-внешние-модели
      - text: Содержимое систем с персональными данными, служебной и другой охраняемой информацией внешнему сервису не отправлено без решения владельца.
        chapter: 02-approaches/03-ai.md#закрытые-данные-и-внешние-модели
      - text: Закрытые наборы описывает модель в своём контуре; внешнему сервису — с согласия владельца — только названия и типы полей или обезличенная выборка.
        chapter: 02-approaches/03-ai.md#закрытые-данные-и-внешние-модели
      - text: Если сервис за рубежом, а в данных есть сведения о людях, проверено правило о трансграничной передаче.
        chapter: [02-approaches/03-ai.md#закрытые-данные-и-внешние-модели, 09-appendices/02-legal-framework.md#темы-и-страны]
      - text: Условия сервиса прочитаны заранее — хранит ли поставщик присланное и обучает ли на нём модели.
        chapter: 02-approaches/03-ai.md#закрытые-данные-и-внешние-модели

  - id: dead-url
    title: Если адрес не работает
    steps: [3, 7]
    when: Источник не открылся при поиске или при обновлении
    items:
      - text: Домен проверен и с www, и без; результат записан с датой и сетью проверки.
        chapter: 04-sources/06-legacy.md#как-проверить-адрес
      - text: Ответ «не ответил» перепроверен из сети страны.
        chapter: 04-sources/06-legacy.md#как-проверить-адрес
      - text: Перенаправление прослежено до конечной страницы — тот же владелец и тот же ресурс, а не главная страница или чужой сайт.
        chapter: 04-sources/06-legacy.md#как-проверить-адрес
      - text: У подозрительного домена проверена дата регистрации.
        chapter: 04-sources/06-legacy.md#как-проверить-адрес
      - text: Найдены первая и последняя копии в веб-архивах; в них содержимое, а не заглушка, страница защиты от программ или пустая оболочка.
        chapter: 04-sources/06-legacy.md#веб-архивы
      - text: Проверено, сохранились ли файлы данных, а не только страницы.
        chapter: 04-sources/06-legacy.md#что-сохраняет-архив
      - text: Преемника искали по документам — акту о выводе из эксплуатации, реестру систем, закупкам, заявлениям владельца.
        chapter: 04-sources/06-legacy.md#где-искать-преемника
      - text: "Найденный преемник связан с прежней записью через `successor_of:`; ненайденный записан с тем, где искали."
        chapter: 04-sources/06-legacy.md#где-искать-преемника
      - text: "Состав преемника сравнён с прежним: чего в нём нет и с какой даты он ведётся."
        chapter: 04-sources/06-legacy.md#где-искать-преемника
      - text: "Запись не удалена: статус, дата, ссылка на копию в `archive_url`, прежний адрес — в синонимах."
        chapter: 04-sources/06-legacy.md#как-отметить-в-реестре
      - text: Ссылки на потерянный домен убраны из общедоступной части реестра и карты.
        chapter: 04-sources/06-legacy.md#как-отметить-в-реестре

  - id: closed
    title: Перед тем как записать «закрыто»
    steps: [3]
    when: Данные не нашлись в открытом доступе
    items:
      - text: Пройдены все способы порядка проверки — файлы, порталы, интерфейс, страницы, условия доступа; государственные сайты — из сети своей страны.
        chapter: 03-process/06-access.md#порядок-проверки
      - text: Найдено подтверждение — норма, акт о системе или ответ владельца; без него статус — «не установлено».
        chapter: 03-process/06-access.md#шкала
      - text: Причина записана — норма с номером, статьёй и редакцией или подтверждение владельца, что нормы нет.
        chapter: 03-process/06-access.md#как-записать
      - text: Проверено, не входит ли набор в то, что закрыть нельзя, и нет ли обязанности его публиковать.
        chapter: 03-process/06-access.md#что-закрыть-нельзя
      - text: Проверено, закрыт ли весь набор или только часть — поля, записи, подробность; доступная часть или агрегат записаны отдельно.
        chapter: 03-process/06-access.md#ограничивают-сведения-а-не-набор
      - text: Записаны дата проверки и, если у ограничения есть срок, дата, когда его перепроверить.
        chapter: 03-process/06-access.md#как-записать

  - id: quality
    title: При проверке качества
    steps: [3, 5]
    when: Набор нужен для цели
    items:
      - text: У каждого вопроса записаны главные признаки и порог «годится» — до проверки.
        chapter: 03-process/07-quality.md#что-проверять-в-первую-очередь
      - text: Описание набора сверено с данными — периодичность, формат, поля, коды; расхождения заданы владельцу.
        chapter: 03-process/07-quality.md#описание-и-данные
      - text: Проверка — на самих данных, с датой скачивания и датой данных.
        chapter: 03-process/07-quality.md#быстрая-проверка
      - text: Найдены пропуски под видом значений — пробелы, «0000», «01.01.1900».
        chapter: 03-process/07-quality.md#быстрая-проверка
      - text: Если для цели важна точность, случайная выборка сверена с независимым источником, размер выборки записан.
        chapter: 03-process/07-quality.md#сколько-записей-сверять
      - text: У каждой пары «вопрос — набор» есть итог — годится, годится с оговорками, не годится, не проверено — с причиной.
        chapter: 03-process/07-quality.md#годится-ли-для-задачи
      - text: Находки разобраны — оговорки в отметке, похожее на ошибку — вопросом владельцу с примерами записей, непригодное — в списке пробелов.
        chapter: 03-process/07-quality.md#что-делать-с-находками

  - id: gaps-and-plan
    title: Пробелы и план
    steps: [4, 5, 6]
    when: Черновик реестра готов
    items:
      - text: Экспертам показали черновик реестра или карты, а не спросили «какие данные есть».
        chapter: 03-process/08-gaps-and-plan.md#шаг-4-эксперты-и-владельцы
      - text: Каждая подсказка эксперта подтверждена источником — адресом, документом, выгрузкой — до внесения в реестр.
        chapter: 03-process/08-gaps-and-plan.md#шаг-4-эксперты-и-владельцы
      - text: Владельцы ключевых наборов получили свои записи и подтвердили или исправили их; молчание не записано как подтверждение.
        chapter: 03-process/08-gaps-and-plan.md#ключевые-наборы
      - text: Подтверждение записано в поле «откуда известно» — кто, чем и когда; дата проверки записи заменена датой ответа.
        chapter: 03-process/08-gaps-and-plan.md#где-записать-подтверждение
      - text: Есть таблица покрытия — у каждой пары «вопрос — источник» доступность и итог качества для этого вопроса.
        chapter: 03-process/08-gaps-and-plan.md#шаг-5-таблица-покрытия
      - text: Перед тем как записать пробел, вопрос поискали ещё раз другим методом.
        chapter: 03-process/08-gaps-and-plan.md#шаг-5-таблица-покрытия
      - text: У каждого пробела записаны вид и то, мешает ли он главной цели.
        chapter: 03-process/08-gaps-and-plan.md#виды-пробелов
      - text: "У каждого пробела строка плана: пробел, решение, кто — по имени или подразделению, срок — датой."
        chapter: 03-process/08-gaps-and-plan.md#шаг-6-план
      - text: Принятые пробелы записаны с причиной и датой пересмотра.
        chapter: 03-process/08-gaps-and-plan.md#шаг-6-план
      - text: Описание данных новой системы или доработки внесено в реестр до технического задания.
        chapter: 03-process/08-gaps-and-plan.md#доработка-от-данных-а-не-от-экранов

  - id: files
    title: Если реестр ведут файлами
    steps: [2, 7]
    when: Реестр — таблицы или файлы в git, а не каталог
    items:
      - text: Реестр разложен на таблицы — записи, владельцы, полномочия, вопросы, связи; каждое сведение записано в одном месте.
        chapter: 06-tools/03-registry-as-data.md#что-хранить
      - text: Доступность и качество — у пары «вопрос — набор», а не у источника.
        chapter: 06-tools/03-registry-as-data.md#что-хранить
      - text: У каждой строки постоянный идентификатор латиницей; коды исчезнувших записей не отданы новым.
        chapter: 06-tools/03-registry-as-data.md#идентификаторы
      - text: Ссылки между таблицами — идентификаторами, а не названиями и адресами.
        chapter: 06-tools/03-registry-as-data.md#идентификаторы
      - text: Таблица не испортила значения — колонки с кодами и датами текстовые, даты по ISO 8601, смысл в значениях, а не в цвете и объединённых ячейках.
        chapter: 06-tools/03-registry-as-data.md#формат
      - text: Рядом с данными лежит схема — для шаблона книги [registry.schema.json](pathname:///templates/registry.schema.json) — и каждая версия её проходит.
        chapter: 06-tools/03-registry-as-data.md#схема
      - text: Проверки запускаются при каждой правке, а не перед публикацией; ошибки останавливают сборку, предупреждения разбирает владелец процесса.
        chapter: 06-tools/03-registry-as-data.md#проверки
      - text: Страницы, CSV, общедоступная часть и отчёт строятся из данных; на них написано, что руками их не правят.
        chapter: 06-tools/03-registry-as-data.md#что-из-этого-строится
      - text: Результаты проверок адресов и качества хранятся с датой и сетью; производные файлы не хранятся.
        chapter: 06-tools/03-registry-as-data.md#проверка-адресов
      - text: История — в git или копиями с датой в имени; копия лежит в другом месте, а не только в описываемой системе.
        chapter: 06-tools/03-registry-as-data.md#история-и-версии
      - text: Полный реестр — в закрытом репозитории или системе; в открытый попадает только общедоступная часть.
        chapter: 06-tools/03-registry-as-data.md#кто-правит-и-как

  - id: before-publication
    title: Перед публикацией реестра
    steps: [7]
    when: Реестр собран, его готовят к передаче или публикации
    intro: Два списка — сначала записи, потом сама публикация.
    sections:
      - title: Записи готовы
        items:
          - text: У каждой записи есть владелец и ответственный — сотрудник, который знает данные, а не пресс-служба или приёмная.
            chapter: 03-process/03-owners-and-mandates.md#владелец-оператор-ответственный
          - text: Владелец взят из положения или акта о системе, а не по домену; оператор и подрядчик записаны отдельно.
            chapter: 03-process/03-owners-and-mandates.md#владелец-оператор-ответственный
          - text: У каждого полномочия в границах есть итог; строки «не найдено» не удалены.
            chapter: 03-process/03-owners-and-mandates.md#от-полномочия-к-набору
          - text: У каждой записи отмечено, откуда о ней известно.
            chapter: 02-approaches/02-methods.md#как-записать-откуда-известно
          - text: Строки из анкет подтверждены вторым методом, выборкой или на экране; у каждой строки анкеты есть итог.
            chapter: 03-process/04-questionnaires.md#как-проверять-ответы
          - text: Охват опроса — кто ответил, кто нет — записан в паспорт.
            chapter: 03-process/04-questionnaires.md#как-записать
          - text: Записи, которые составила языковая модель, помечены и подтверждены документом, вторым методом или человеком.
            chapter: 02-approaches/03-ai.md#3-проверить-в-три-слоя
          - text: У каждого режима доступа есть подтверждение и дата проверки.
            chapter: 03-process/06-access.md#как-записать
          - text: У «закрыто» и «с ограничениями» — причина с нормой или пометкой «нормы нет», у «с ограничениями» — условия, у «не установлено» — что проверяли, из какой сети и что дальше.
            chapter: 03-process/06-access.md#как-записать
          - text: Закрытые и неопубликованные наборы в реестре есть; закрытые без нормы и неструктурированные сведения выписаны как кандидаты на открытие.
            chapter: 03-process/06-access.md#что-делать-со-статусом
          - text: Качество проверено на самих данных хотя бы у наборов, нужных для цели; в отметке — признаки, числа и дата данных.
            chapter: 03-process/07-quality.md#как-записать-в-реестр
          - text: У непроверенных наборов — «не проверено» и причина.
            chapter: 03-process/07-quality.md#как-записать-в-реестр
          - text: Составлен список пробелов, и у каждого есть решение или пометка, что его принимают.
            chapter: 03-process/08-gaps-and-plan.md#шаг-6-план
          - text: В 14 атрибутах нет пустых ячеек — значение, «нет» или «не установлено» с тем, где искать дальше.
            chapter: 03-process/05-registry.md#если-сведение-не-найдено
          - text: Режим доступа, периодичность и тип записи — значения из справочников.
            chapter: 03-process/05-registry.md#справочники-значений
          - text: Полный набор и его агрегат, первоисточник и копия записаны отдельно и связаны.
            chapter: 03-process/05-registry.md#что-считать-записью
          - text: У записей из общественных проектов, международных баз и научных репозиториев владелец — тот, кто ведёт копию; дата изменения взята из данных; записаны условия копии и первоисточника.
            chapter: 04-sources/03-public.md#как-записать
          - text: У каждого владельца записан слой данных; у пограничных случаев — почему выбран этот слой.
            chapter: 04-sources/01-three-layers.md#как-определить-слой
          - text: Купленные и полученные по соглашению данные описаны с поставщиком, соглашением, сроком и ограничениями на передачу и публикацию.
            chapter: 04-sources/01-three-layers.md#слои-в-двух-подходах
          - text: Нет одного набора под разными именами — синонимы записаны, дубли объединены.
            chapter: 03-process/05-registry.md#один-набор-под-разными-именами
          - text: Подробность записей одинакова; у групп записан состав, и группы не пересекаются.
            chapter: 03-process/05-registry.md#одинаковая-подробность
      - title: Публикация
        items:
          - text: Адреса проверены; государственные сайты — из сети своей страны.
            chapter: 04-sources/06-legacy.md#как-проверить-адрес
          - text: Проверки программой проходят без ошибок; 10–20 случайных записей проверены заново.
            chapter: 03-process/09-result-and-upkeep.md#проверка
          - text: Запросы из главы «Практики и антипаттерны» выполнены, каждая найденная запись разобрана.
            chapter: 08-practices/01-practices-and-anti-patterns.md#проверить-реестр-запросами
          - text: Реестр посмотрели эксперты и владельцы ключевых наборов.
            chapter: 03-process/08-gaps-and-plan.md#шаг-4-эксперты-и-владельцы
          - text: Результат проверил тот, кто будет им пользоваться, — нашёл ответы на два-три вопроса из списка.
            chapter: 03-process/09-result-and-upkeep.md#виды-результата
          - text: Общедоступная часть строится из полного реестра программой; правило выборки утвердили юрист и владелец задачи.
            chapter: 03-process/09-result-and-upkeep.md#полный-реестр-и-общедоступная-часть
          - text: Закрытые наборы в общедоступной части — с основанием и порядком получения, без имён и телефонов сотрудников.
            chapter: 03-process/09-result-and-upkeep.md#полный-реестр-и-общедоступная-часть
          - text: Есть паспорт — цель, границы, методы и охват, состав, пробелы, правило общедоступной части, даты и версия.
            chapter: 03-process/09-result-and-upkeep.md#паспорт
          - text: Опубликована таблица или данные, а не только отчёт, — по постоянному адресу, с лицензией на сам реестр и каналом для замечаний.
            chapter: 03-process/09-result-and-upkeep.md#публикация
          - text: Назначены владелец процесса и ответственные за записи.
            chapter: 03-process/09-result-and-upkeep.md#кто-отвечает-после-публикации
          - text: Им переданы паспорт, справочники, скрипты проверок и план обновления — или результат помечен как снимок, который не обновляется.
            chapter: [03-process/09-result-and-upkeep.md#кто-отвечает-после-публикации, 03-process/09-result-and-upkeep.md#снимок-или-живой-реестр]

  - id: data-map
    title: Перед публикацией карты данных
    steps: [7]
    when: Результат — карта данных
    items:
      - text: Вид карты выбран под задачу, вопросы согласованы с заказчиком.
        chapter: 02-approaches/04-data-maps.md#как-выбрать-вид-и-форму
      - text: Каждый источник записан один раз, с типом и владельцем; сайты без найденной системы помечены.
        chapter: 02-approaches/04-data-maps.md#как-составить-карту
      - text: Доступность отмечена у каждой пары «вопрос — источник», с основанием и датой; непроверенное — «не установлено».
        chapter: 03-process/06-access.md#чему-ставить-статус
      - text: У каждого источника записан слой данных; у копии — первоисточник, и при подсчёте источников вопроса они считаются одним.
        chapter: 04-sources/01-three-layers.md#как-записать
      - text: Выписаны пробелы, ключевые и единственные источники.
        chapter: 02-approaches/04-data-maps.md#что-читать-на-карте
      - text: Ключевые источники описаны отдельной записью реестра и проверены на качество.
        chapter: 03-process/08-gaps-and-plan.md#ключевые-наборы
      - text: Опубликованы паспорт и таблица или файл данных; картинка построена из них.
        chapter: 06-tools/03-registry-as-data.md#что-из-этого-строится

  - id: domains
    title: Перед передачей реестра доменам
    steps: [7]
    when: Реестр будут вести подразделения — домены, а не центральная команда
    items:
      - text: Первая инвентаризация проведена централизованно и сверена несколькими методами; домены получают готовые записи, а не пустой шаблон.
        chapter: 05-frameworks/03-data-mesh.md#data-mesh-в-двух-подходах
      - text: "Домены выделены по функциям и полномочиям, а не по системам и не по ИТ-подразделениям; у каждой записи один домен в колонке `domain`."
        chapter: 05-frameworks/03-data-mesh.md#домены
      - text: В каждом домене назван ответственный за записи, в центре — владелец процесса с правом требовать исправлений.
        chapter: 03-process/09-result-and-upkeep.md#кто-отвечает-после-публикации
      - text: Состав атрибутов, справочники и правило идентификаторов с префиксом домена записаны как схема, которую проверяет программа.
        chapter: 05-frameworks/03-data-mesh.md#федеративное-управление
      - text: Проверки при сборе — не только форма записи, но и уникальность по всему реестру, ссылки, правдоподобие дат и связи с листами владельцев и полномочий.
        chapter: 05-frameworks/03-data-mesh.md#проверки-программой
      - text: У отчёта об ошибках есть адресат в домене, срок исправления и статус.
        chapter: 05-frameworks/03-data-mesh.md#федеративный-инвентарь-сша
      - text: Записи с непрошедшей проверкой помечены, а не исчезают и не застывают.
        chapter: 05-frameworks/03-data-mesh.md#федеративный-инвентарь-сша
      - text: Записи о чужих данных и записи без домена оставлены за центром.
        chapter: 05-frameworks/03-data-mesh.md#домены
      - text: Назначена сверка описаний доменов с полномочиями, реестром систем и закупками при каждой плановой проверке.
        chapter: 05-frameworks/03-data-mesh.md#федеративное-управление

  - id: update
    title: При обновлении
    steps: [7]
    when: По графику, по событию и перед каждым важным использованием
    items:
      - text: Проверены все адреса — какие исчезли, какие переехали; перенаправление на главную страницу — повод искать сервис заново.
        chapter: 03-process/09-result-and-upkeep.md#что-устаревает
      - text: Найдены записи, у которых дата изменения данных старше, чем обещает периодичность.
        chapter: 03-process/09-result-and-upkeep.md#что-проверять-программой
      - text: Ответственные получили выгрузку своих записей и отметили изменения; ушедших сотрудников заменили.
        chapter: 03-process/09-result-and-upkeep.md#кто-отвечает-после-публикации
      - text: Владельцы сверены с действующей структурой органов власти; у упразднённых записан преемник.
        chapter: 03-process/03-owners-and-mandates.md#кто-отвечает-за-тему
      - text: Проверен статус нормативных актов — по чек-листу «Перед ссылкой на нормативный акт».
        chapter: 09-appendices/02-legal-framework.md#где-проверять-акт
      - text: Проверены сроки соглашений о коммерческих данных и то, обновляются ли общественные проекты и копии.
        chapter: 04-sources/01-three-layers.md#чего-ждать-от-качества
      - text: У бесплатных коммерческих источников проверено, не изменились ли условия и тот ли продукт отвечает по адресу.
        chapter: 04-sources/04-commercial.md#частые-ошибки
      - text: Режимы доступа перепроверены по порядку проверки; у «не установлено» — повторная проверка или ответ на запрос, у ограничений со сроком — истёк ли срок.
        chapter: 03-process/06-access.md#порядок-проверки
      - text: Повторены проверки качества у наборов, которые обновились, — по прежним порогам; в отметке новая дата данных.
        chapter: 03-process/07-quality.md#как-записать-в-реестр
      - text: Запросы из журнала поиска повторены; новые находки и исчезнувшие карточки разобраны.
        chapter: 04-sources/05-dataset-search.md#как-записать
      - text: Исчезнувшие записи помечены, а не удалены.
        chapter: 04-sources/06-legacy.md#как-отметить-в-реестре
      - text: Новые системы, контракты и выведенные системы за период внесены в реестр.
        chapter: 03-process/09-result-and-upkeep.md#что-встроить-в-процессы
      - text: Общедоступная часть пересобрана из полного реестра.
        chapter: 03-process/09-result-and-upkeep.md#полный-реестр-и-общедоступная-часть
      - text: Записаны список изменений, новая версия и дата следующей проверки.
        chapter: 03-process/09-result-and-upkeep.md#версии-и-список-изменений
