# Заготовка карты данных: паспорт карты и вопросы со ссылками на источники.

# Идентификатор карты: латиница, цифры и дефисы.
id: my-topic
# Тема карты.
title: Моя тема
# Виды карты, один или несколько: questions — от вопросов,
# authority — по полномочиям, product — от продукта, availability — доступности.
kind: [questions, availability]
# Месяц и год проверки: ГГГГ-ММ.
checked: 2026-10
# Кто составил карту.
author: Имя Фамилия
# Лицензия карты.
license: CC BY 4.0
# Откуда взяты сведения: методы и документы.
info_sources: откуда взяты сведения
# Вопросы карты.
questions:
  # n — номер вопроса по порядку с 1; text — текст вопроса;
  # sources — пары source/availability, по паре на источник ответа.
  - n: 1
    text: Где найти …?
    sources:
      # source — идентификатор из списка источников (колонка id в sources.csv).
      # availability — доступность данных для этого вопроса в этом источнике:
      # available — данные доступны, restricted — доступны с ограничениями,
      # unavailable — не доступны.
      - {source: some-source-id, availability: available}
